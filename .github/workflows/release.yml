name: Release Windows

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install numpy==2.4.6
      - name: Install FFmpeg for export tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg for export tests (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: ffmpeg -version
      - run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q . -x '/(\.venv|LaughterSegmentation|Respiro-en|three-brain-out|docs-archivo)/'

  windows-installer-smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in @("setup-windows.ps1", "configurar-github.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file`: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { throw "PowerShell syntax validation failed" }
      - name: Install from scratch and verify runtime
        shell: powershell
        run: .\setup-windows.ps1 -NonInteractive
      - name: Re-run setup and verify idempotent repair path
        shell: powershell
        run: .\setup-windows.ps1 -NonInteractive

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, windows-installer-smoke]
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate PowerShell installers
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @("setup-windows.ps1", "configurar-github.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file`: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { throw "PowerShell syntax validation failed" }
      - name: Validate tag and build signed-by-hash assets
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          if ((Get-Content VERSION -Raw).Trim() -ne $version) { throw "VERSION no coincide con el tag" }
          python tools/build_release.py --version $version --output dist --require-repository
      - name: Publish release assets
        shell: pwsh
        run: |
          $assets = (Get-ChildItem dist -File).FullName
          gh release create "${{ github.ref_name }}" @assets --verify-tag --generate-notes
