name: Release Windows

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install numpy==2.4.6
      - run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q . -x '/(\.venv|LaughterSegmentation|Respiro-en|three-brain-out|docs-archivo)/'

  publish:
    needs: verify
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Validate tag and build signed-by-hash assets
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          if ((Get-Content VERSION -Raw).Trim() -ne $version) { throw "VERSION no coincide con el tag" }
          python tools/build_release.py --version $version --output dist --require-repository
      - name: Publish release assets
        shell: pwsh
        run: |
          $assets = (Get-ChildItem dist -File).FullName
          gh release create "${{ github.ref_name }}" @assets --verify-tag --generate-notes
